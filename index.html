<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDF5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 가족 기록장">
<title>우리 가족 기록장</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BA%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FFFDF5; --card:#FFFFFF; --ink:#3D4A5C; --ink2:#8595A8; --ink3:#AEBECD;
  --line:#E8F1F8; --rose:#D9557F; --pink:#FF7FA5; --mint:#3FBFA6; --sky:#4FA9DE;
  --gold:#EFA93A; --shadow:0 8px 22px rgba(110,160,200,.14);
}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:#EDF6FC;letter-spacing:-0.3px;-webkit-font-smoothing:antialiased;
  font-size:15px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word;
}
body.modal-open{overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
input,textarea,select{font-family:inherit}
h1,h2,h3,h4,p{margin:0}
img,svg{display:block}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:104px;box-shadow:0 0 60px rgba(120,165,205,.10);position:relative;overflow-x:hidden}

/* ---------- header ---------- */
.hdr{padding:20px 18px 2px;background:linear-gradient(180deg,#E3F3FE 0%,#F1FAFF 60%,#FFFDF5 100%)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:7px;min-width:0}
.brand h1{font-size:21px;font-weight:900;letter-spacing:-1.1px;background:linear-gradient(92deg,#2C7EB8,#3FA9DC 45%,#E9618B);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;white-space:nowrap}
.mascot{width:34px;height:34px;flex:0 0 auto}
.mascot svg{width:100%;height:100%}
.gear{width:44px;height:44px;flex:0 0 auto;border-radius:16px;background:#fff;box-shadow:var(--shadow);font-size:17px;display:grid;place-items:center;border:1.5px solid #E1EFF9}
.gear:active{transform:scale(.94)}
.hdr-btns{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.hdr-btns .gear.lockbtn{width:38px;height:38px;border-radius:14px;font-size:15px;box-shadow:0 5px 14px rgba(110,160,200,.12)}
.hdr-date{margin-top:9px;font-size:13px;color:#7FA4BE;font-weight:800}
.hdr-sub{font-size:13px;color:#86A7BE;font-weight:600}
.hdr-pills{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 14px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:8px 12px;border-radius:14px;font-size:12px;font-weight:800;background:#fff;border:1.5px solid #E2EFF9;box-shadow:0 4px 12px rgba(120,170,210,.12);color:#6D8CA4;line-height:1.2}
.pill.dday{background:linear-gradient(135deg,#E4F5FF,#FFEAF1);border-color:#D2EAF9;color:#D9557F}
.pill.soft{background:#FBFEFF;color:#8FAEC2}
.pill.dday:active{transform:scale(.97)}

/* ---------- layout ---------- */
#view{padding:2px 14px 10px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);border:1.5px solid #EAF3FA}
.card.mint{background:linear-gradient(160deg,#E4F8EF 0%,#FBFFFD 70%)}
.card.lav{background:linear-gradient(160deg,#EFEDFD 0%,#FCFDFF 72%)}
.card.pink{background:linear-gradient(160deg,#FFE6EF 0%,#FFFBFD 72%)}
.card.sky{background:linear-gradient(160deg,#DFF1FE 0%,#FBFDFF 72%)}
.row{display:flex;align-items:center}
.row.between{justify-content:space-between}
.row.gap{gap:8px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.center{text-align:center}
.muted{color:var(--ink2)}
.small{font-size:12.5px}
.tiny{font-size:11.5px;line-height:1.45}
.card-title{font-size:15.5px;font-weight:900;letter-spacing:-0.5px;display:flex;align-items:center;gap:5px}
.sub-line{font-size:12.5px;color:var(--ink2);margin-top:5px;font-weight:600}
.divider{height:1.5px;border-radius:2px;background-image:linear-gradient(90deg,#E3EFF8 55%,transparent 55%);background-size:9px 1.5px;margin:10px -2px}
.foot-note{text-align:center;font-size:11.5px;color:#A6B9C9;font-weight:700;padding:2px 0 6px}

/* ---------- buttons ---------- */
.btn{border-radius:16px;padding:12px 14px;font-weight:900;font-size:14px;letter-spacing:-0.4px;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;transition:transform .12s ease,box-shadow .12s ease}
.btn.grow{flex:1;min-width:0}
.composer .btn.send{padding:12px 14px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#6BD3E8,#3FA9DC);color:#fff;box-shadow:0 6px 16px rgba(63,169,220,.30)}
.btn.mint{background:linear-gradient(135deg,#EBFBF5,#DCF5EC);color:#1E9478;border:1.5px solid #CFF0E3}
.btn.white{background:#fff;border:1.5px solid #E7F1F9;color:#6E8AA2;box-shadow:0 3px 10px rgba(120,160,200,.10)}
.btn.ghost{background:#F1F8FD;color:#7C9BB3}
.btn.sm{padding:9px 12px;font-size:12.5px;border-radius:14px}
.btn.wfull{width:100%}
.btn[disabled]{opacity:.6}
.btn.danger-text{color:#D05F76}
.mini{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:14px;background:#F8FCFE;border:1.5px solid #E7F1F9;flex:0 0 auto}
.mini:active{transform:scale(.92)}
.mini.on{background:#E8F7FE;border-color:#C4E6F7}
.mini.danger{color:#D0738A;background:#FFF7F9;border-color:#FAE4EA}
.icon-btn{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:#EFF7FD;color:#7C9CB4;font-size:14px;font-weight:900;flex:0 0 auto}
.add-dash{width:100%;border-radius:16px;padding:12px;font-size:13px;font-weight:900;color:#7FA0B8;border:1.7px dashed #D9EAF5;background:#FBFEFF;margin-top:10px}
.add-dash:active{background:#EFFAFF}
.chip{display:inline-flex;align-items:center;gap:4px;padding:8px 13px;border-radius:13px;font-size:12.5px;font-weight:900;background:#fff;border:1.5px solid #E4EFF8;color:#7894AB}
.chip.on{background:linear-gradient(135deg,#E6F4FE,#DBEDFF);border-color:#B9DDF7;color:#2F80B7}
.chip-soft{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:12px;font-size:11.5px;font-weight:900;background:#F2FBFF;color:#3F8FB0;border:1.5px solid #DDEFF9;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border-radius:10px;font-size:11.5px;font-weight:900;background:#FFF8EC;color:#AF8A4E;border:1px solid #FAEDD8;white-space:nowrap}
.tag.money{background:#FFF4D9;color:#B08530;border-color:#F7E4B6}
.tag.blue{background:#EFF7FF;color:#4E86BB;border-color:#DBEAFB}

/* ---------- check ---------- */
.chk{width:26px;height:26px;flex:0 0 auto;border-radius:9px;border:2.5px solid #D3E3EF;background:#fff;display:grid;place-items:center;transition:all .15s ease}
.chk svg{width:16px;height:16px}
.chk.on{background:linear-gradient(180deg,#74DCC4,#3FBFA6);border-color:#3FBFA6;box-shadow:0 3px 9px rgba(63,191,166,.32)}
.chk:active{transform:scale(.9)}

/* ---------- family cards ---------- */
.fam{padding:12px}
.m-row{display:flex;align-items:center;gap:11px;background:#fff;border-radius:19px;padding:11px 12px;box-shadow:0 4px 12px rgba(120,160,200,.10)}
.m-row+.m-row{margin-top:8px}
.m-ava{width:54px;height:54px;flex:0 0 auto;border-radius:50%;background:radial-gradient(circle at 50% 40%,#F4FBFF,#E6F4FE);display:grid;place-items:center;border:1.5px solid #DCEEF9}
.m-ava svg{width:46px;height:46px}
.m-name{font-size:16px;font-weight:900;letter-spacing:-0.6px}
.m-intro{font-size:11.5px;color:#93A7B9;font-weight:700;margin-top:1px}
.m-stat{text-align:right;flex:0 0 auto}
.m-star{font-size:13.5px;font-weight:900;color:#C79A45}
.m-pig{font-size:11px;font-weight:800;color:#6E9BB0;margin-top:2px}

/* ---------- stamp ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:12px 0 10px}
.wd{text-align:center}
.wd-label{font-size:10.5px;font-weight:900;color:#93A9BC}
.slot{width:38px;height:38px;margin:5px auto 0;border-radius:50%;border:2px dashed #DCEAF4;background:#FBFEFF;display:grid;place-items:center}
.slot.on{border:2px solid #CBEEDF;background:linear-gradient(160deg,#F0FCF7,#E3F8F0)}
.slot.on svg{width:30px;height:30px}
.slot.today{box-shadow:0 0 0 3px #FFDDE9}
.streak{display:inline-flex;align-items:center;gap:3px;padding:6px 11px;border-radius:13px;font-size:12px;font-weight:900;color:#D9527C;background:#FFF1F5;border:1.5px solid #FBD3E1}

/* ---------- mission ---------- */
.mission-emoji{font-size:34px;margin:12px 0 2px;line-height:1}
.mission-text{font-size:16px;font-weight:900;letter-spacing:-0.5px;margin-bottom:13px}

/* ---------- todo ---------- */
.grp{border-radius:22px;padding:13px;border:1.5px solid #EDF5FA;background:#fff;box-shadow:var(--shadow)}
.grp.t0{background:linear-gradient(160deg,#F5FDF9,#FFFFFF 60%)}
.grp.t1{background:linear-gradient(160deg,#FFF5F9,#FFFFFF 60%)}
.grp.t2{background:linear-gradient(160deg,#F3FAFF,#FFFFFF 60%)}
.grp.t3{background:linear-gradient(160deg,#F8F7FF,#FFFFFF 60%)}
.grp-head{display:flex;align-items:center;gap:9px}
.grp-ava{width:42px;height:42px;border-radius:50%;background:#fff;border:1.5px solid #DCEEF9;display:grid;place-items:center}
.grp-ava svg{width:36px;height:36px}
.grp-name{font-size:15px;font-weight:900}
.grp-count{font-size:11.5px;color:#93A7B9;font-weight:800}
.todo{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1.6px dashed #EDF4FA}
.todo:last-of-type{border-bottom:none}
.todo-label{flex:1;font-size:14px;font-weight:700;letter-spacing:-0.3px;word-break:break-all}
.todo.done .todo-label{color:#AEBECD;text-decoration:line-through;text-decoration-thickness:1.5px}

/* ---------- study ---------- */
.srow{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1.6px dashed #EDF4FA}
.srow:last-of-type{border-bottom:none}
.srow-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.srow-label{font-size:14px;font-weight:800;letter-spacing:-0.3px;word-break:break-all;max-width:100%}
.srow-tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.srow.done .srow-label{color:#AEBECD;text-decoration:line-through;text-decoration-thickness:1.5px}
.srow-acts{display:flex;gap:4px;flex:0 0 auto}
.bar{height:12px;border-radius:8px;background:#E9F2F9;overflow:hidden;margin:10px 0 4px}
.bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#7FD8F0,#3FA9DC);transition:width .35s ease}
.timer-card .seg{display:flex;gap:6px;background:#F6FCFF;border-radius:16px;padding:4px;border:1.5px solid #E5F1F9;margin:10px 0 6px}
.seg-btn{flex:1;padding:9px;border-radius:12px;font-size:12.5px;font-weight:900;color:#8AA6BC}
.seg-btn.on{background:linear-gradient(135deg,#E4F4FE,#D8EBFF);color:#2F80B7;box-shadow:0 3px 10px rgba(90,160,210,.18)}
.timer-time{font-family:"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:52px;font-weight:900;text-align:center;letter-spacing:-2px;color:#2E5C7A;font-variant-numeric:tabular-nums;line-height:1.1;margin:8px 0 14px}
.presets{margin-top:10px}
.switch{width:50px;height:30px;border-radius:20px;background:#DEEAF3;padding:3px;display:flex;flex:0 0 auto;transition:background .2s}
.switch span{width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(120,150,180,.25);transition:transform .2s}
.switch.on{background:linear-gradient(135deg,#7DDCC6,#3FBBA4)}
.switch.on span{transform:translateX(20px)}

/* ---------- inputs ---------- */
.inp{width:100%;padding:12px 13px;border-radius:14px;border:1.7px solid #E4EFF7;background:#FBFEFF;font-size:16px;font-weight:700;color:var(--ink);outline:none}
.inp:focus{border-color:#A9DFF5;background:#fff;box-shadow:0 0 0 3px #EFF9FF}
.inp.big{font-size:20px;font-weight:900;letter-spacing:-0.5px}
.inp.sm{padding:9px 11px;font-size:14px}
.inp.sub{font-size:13px;padding:8px 11px;margin-top:6px;font-weight:600}
.w120{width:120px;text-align:right}
.field{display:block;font-size:12px;font-weight:900;color:#7C99AF;margin-top:10px}
.field .inp{margin-top:5px}

/* ---------- allowance ---------- */
.allow-top{background:linear-gradient(160deg,#E7F6FF 0%,#FFEFF5 65%,#FFFDF8 100%)}
.allow-amount{font-size:30px;font-weight:900;letter-spacing:-1.5px;color:#B5763B}
.allow-amount em{font-style:normal;font-size:14px;font-weight:900;margin-left:2px;color:#C59468}
.allow-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.allow-tags .tag b{font-weight:900}
.tx{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1.6px dashed #EDF4FA;font-size:13px}
.tx:last-child{border-bottom:none}
.tx-memo{flex:1;font-weight:800;min-width:0;word-break:break-all}
.tx-day{font-size:11px;color:#A6B9C9;font-weight:700}
.tx-amt{font-weight:900;font-size:13.5px}
.tx-amt.plus{color:#2E9E86}
.tx-amt.minus{color:#D0788E}
.day-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1.6px dashed #EDF4FA;font-size:13px}
.day-row:last-child{border-bottom:none}
.day-row .d{font-weight:800}
.day-row .n{font-weight:900;color:#B98C3C}
.empty{padding:18px 6px;text-align:center;font-size:12.5px;color:#A6B9C9;font-weight:700}

/* ---------- chat ---------- */
.note-bar{background:#F2FBFF;border:1.5px solid #DCEFF9;border-radius:16px;padding:10px 12px;font-size:11.5px;font-weight:700;color:#4E8AA8;line-height:1.45}
.chat-list{display:flex;flex-direction:column;gap:13px;padding:2px 2px 0}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:88%}
.msg.mine{margin-left:auto;flex-direction:row-reverse}
.msg-ava{width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:#fff;border:1.5px solid #DCEEF9;display:grid;place-items:center;overflow:hidden}
.msg-ava svg{width:32px;height:32px}
.msg-body{min-width:0}
.msg-meta{font-size:10.5px;color:#A6B9C9;font-weight:800;margin-bottom:4px;padding:0 3px}
.msg.mine .msg-meta{text-align:right}
.bubble{background:#fff;border:1.5px solid #E9F2F9;border-radius:6px 18px 18px 18px;padding:11px 13px;font-size:14px;font-weight:700;line-height:1.45;box-shadow:0 4px 12px rgba(120,160,200,.10);word-break:break-word;white-space:pre-wrap}
.msg.mine .bubble{background:linear-gradient(160deg,#E9F6FE,#F8FCFF);border-color:#D2EAF8;border-radius:18px 6px 18px 18px}
.bubble.sticker{background:none;border:none;box-shadow:none;padding:0;font-size:44px;line-height:1.1}
.msg.mine .bubble.sticker{background:none;border:none;box-shadow:none}
.bubble.sticker svg{width:56px;height:56px}
.msg-react{display:flex;gap:5px;margin-top:5px}
.msg.mine .msg-react{justify-content:flex-end}
.react{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:11px;background:#fff;border:1.5px solid #E8F1F8;font-size:11px;font-weight:900;color:#C7808F}
.react.on{background:#FFEFF5;border-color:#F9CFDC;color:#D9557F}
.react.del{color:#B9C8D5}
.composer{position:sticky;bottom:104px;margin-top:2px;display:flex;align-items:center;gap:7px;background:rgba(255,253,245,.94);backdrop-filter:blur(10px);padding:8px 0}
.composer.tray-open{position:static}
.composer .inp{background:#fff}
.composer form{min-width:0}
.send{padding:12px 16px;flex:0 0 auto;font-size:13px}
.sticker-tray{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#fff;border:1.5px solid #E7F1F9;border-radius:18px;padding:10px;box-shadow:var(--shadow)}
.sticker-tray button{font-size:24px;padding:6px 0;border-radius:12px;background:#FBFEFF}
.sticker-tray button svg{width:30px;height:30px;margin:0 auto}
.sticker-tray button:active{background:#EAF7FF}
.chat-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}

/* ---------- nav ---------- */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;gap:2px;background:rgba(255,253,245,.97);backdrop-filter:blur(14px);border-top:1.5px solid #E7F1F9;padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:50}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:15px;color:#95AEC2;font-weight:900}
.nav-btn .ni{font-size:19px;line-height:1.1;filter:grayscale(.45);transition:transform .15s}
.nav-btn .nl{font-size:10.5px;letter-spacing:-0.3px}
.nav-btn.on{background:linear-gradient(160deg,#E4F4FE,#FFE9F0);color:#D9557F}
.nav-btn.on .ni{filter:none;transform:translateY(-1px) scale(1.06)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(45,60,80,.34);backdrop-filter:blur(2px)}
#modal.open{display:flex}
#modal.center-mode{align-items:center;padding:18px}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;animation:sheetUp .26s cubic-bezier(.2,.9,.3,1)}
#modal.center-mode .sheet{border-radius:26px;max-width:360px;padding:22px 18px;animation:pop .24s ease}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.sheet-head h3{font-size:17px;font-weight:900;letter-spacing:-0.6px}
.sheet-desc{font-size:12.5px;color:var(--ink2);font-weight:700;margin:4px 0 10px;line-height:1.5}
.sheet-body{display:flex;flex-direction:column}
.sheet-actions{display:flex;gap:8px;margin-top:14px}
.sheet-actions .btn{flex:1}
.sh{font-size:13px;font-weight:900;color:#7A93A8;margin:18px 0 6px;letter-spacing:-0.4px}
.big-emoji{font-size:44px;text-align:center;line-height:1;margin-bottom:6px}
.sheet.center .sheet-title{font-size:18px;font-weight:900;text-align:center;margin-bottom:6px}
.mem-edit{border:1.5px solid #E7F1F9;background:#fff;border-radius:18px;padding:11px;margin-bottom:9px}
.mem-edit-top{display:flex;gap:9px;align-items:flex-start}
.mem-edit .mem-ava{width:46px;height:46px}
.mem-edit .mem-ava svg{width:40px;height:40px}
.ava-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:9px}
.ava-pick{padding:3px;border-radius:12px;border:1.8px solid transparent;background:#FBFEFF;display:grid;place-items:center}
.ava-pick svg{width:28px;height:28px}
.ava-pick.on{border-color:#7FC9EC;background:#EAF8FF}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 6px}
.cal-head b{font-size:14px;font-weight:900}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow-cell{text-align:center;font-size:10.5px;font-weight:900;color:#93A9BC;padding:3px 0}
.cal-cell{height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:#FBFEFF;border:1.4px solid #EAF3F9}
.cal-cell.empty{background:none;border:none}
.cal-cell.on{background:linear-gradient(160deg,#F1FCF7,#E2F8F0);border-color:#CBEEDF}
.cal-cell.today{box-shadow:0 0 0 2.5px #FFDDE9}
.cal-num{font-size:10.5px;font-weight:900;color:#8FA9BD}
.cal-cell.on .cal-num{color:#2E9478}
.cal-stamp svg{width:22px;height:22px}

/* one-word settings rows */
.set-row{display:flex;align-items:center;gap:8px;padding:7px 0}
.set-row .nm{font-weight:800;font-size:13px;flex:1;min-width:0}

/* ---------- fx ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.confetti{position:fixed;top:-24px;animation:fall 2.4s ease-in forwards;will-change:transform}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--drift),105vh) rotate(420deg)}}
.coin-pop{position:fixed;transform:translate(-50%,0);font-size:14px;font-weight:900;color:#C08A2A;background:#FFF7DF;border:1.6px solid #F7E3B4;padding:6px 11px;border-radius:13px;box-shadow:0 6px 16px rgba(200,170,110,.28);animation:rise 1.25s ease-out forwards;white-space:nowrap}
@keyframes rise{0%{opacity:0;transform:translate(-50%,6px) scale(.9)}18%{opacity:1;transform:translate(-50%,-4px) scale(1)}100%{opacity:0;transform:translate(-50%,-74px) scale(1)}}
.toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%) translateY(8px);background:rgba(52,68,88,.94);color:#FFFDF5;font-size:13px;font-weight:800;padding:11px 16px;border-radius:14px;box-shadow:0 10px 24px rgba(45,60,80,.28);opacity:0;transition:opacity .2s,transform .2s;max-width:86vw;text-align:center;z-index:210}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.highfive{position:fixed;inset:0;z-index:220;display:grid;place-items:center;background:rgba(240,250,255,.60);backdrop-filter:blur(2px);animation:fadeIn .2s ease}
.highfive.out{opacity:0;transition:opacity .5s}
.hf-card{background:#fff;border-radius:30px;padding:24px 30px;text-align:center;box-shadow:0 24px 60px rgba(90,130,170,.26);border:2px solid #DDEFF9;animation:pop .34s cubic-bezier(.2,1.4,.4,1)}
.hf-ava{display:grid;place-items:center;margin-bottom:2px}
.hf-ava svg{width:72px;height:72px}
.hf-emoji{font-size:34px;line-height:1.1}
.hf-title{font-size:22px;font-weight:900;letter-spacing:-1px;color:#D9557F}
.hf-sub{font-size:13px;font-weight:800;color:#7C99AF;margin-top:2px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.hidden{display:none!important}

/* ---------- 잠금 화면 (PIN 0103) ---------- */
body.locked{overflow:hidden}
body.locked .app,body.locked #modal,body.locked #fx{display:none!important}
.lock{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(170deg,#DCF0FE 0%,#F1FAFF 46%,#FFEFF5 100%)}
.lock.hidden{display:none}
.lock-card{width:100%;max-width:352px;background:#fff;border-radius:30px;padding:20px 20px 16px;text-align:center;
  border:1.5px solid #E4F1FA;box-shadow:0 18px 44px rgba(110,160,200,.22)}
.lock-face{display:flex;justify-content:center;align-items:center;gap:2px;min-height:0}
.lock-face .mascot{width:82px;height:82px}
.lock-title{margin-top:6px;font-size:20px;font-weight:900;letter-spacing:-.9px;background:linear-gradient(92deg,#2C7EB8,#3FA9DC 45%,#E9618B);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.lock-sub{margin-top:4px;font-size:12.5px;font-weight:800;color:#8AAAC0}
.lock-dots{display:flex;justify-content:center;gap:13px;margin:15px 0 13px}
.lock-dot{width:13px;height:13px;border-radius:50%;background:#EAF3FA;border:1.5px solid #D3E6F3;
  transition:transform .12s ease,background .12s ease,border-color .12s ease}
.lock-dot.on{background:linear-gradient(135deg,#63B6E6,#E9618B);border-color:#9FCBE8;transform:scale(1.15)}
.lock-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lock-key{height:54px;border-radius:18px;background:#F6FBFF;border:1.5px solid #E3F0F8;font-size:21px;font-weight:900;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Trebuchet MS",system-ui,sans-serif;letter-spacing:.5px;
  color:#3D5A72;display:grid;place-items:center;transition:transform .08s ease,background .12s ease}
.lock-key:active{transform:scale(.94);background:#E9F5FD}
.lock-key.fn{font-size:14px;font-weight:800;color:#93B0C4;background:transparent;border-color:transparent}
.lock-key.blank{visibility:hidden}
.lock-err{min-height:18px;margin-top:9px;font-size:12.5px;font-weight:800;color:#E1648B}
.lock-hint{margin-top:2px;font-size:11.5px;font-weight:700;color:#A7C0D2;line-height:1.5}
@keyframes lockShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.lock-card.shake{animation:lockShake .4s ease}
@keyframes lockPop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.lock-card{animation:lockPop .28s ease both}

function normalize(o){
  var d = initialState();
  if (!o || typeof o !== 'object') return d;
  if (!Array.isArray(o.members) || !o.members.length) o.members = d.members;
  o.members.forEach(function(m){
    if (!m.id) m.id = uid();
    if (!m.name) m.name = '가족';
    if (typeof m.intro !== 'string') m.intro = '';
    if (LEGACY_AVATARS[m.avatar]) m.avatar = LEGACY_AVATARS[m.avatar];
    if (AVATARS.indexOf(m.avatar) < 0) m.avatar = 'stitch';
  });
  if (!o.childId || !o.members.some(function(m){ return m.id === o.childId; })) o.childId = o.members[0].id;
  if (!Array.isArray(o.todos)) o.todos = [];
  if (!Array.isArray(o.studyPinned)) o.studyPinned = [];
  if (!o.study || !o.study.date || !Array.isArray(o.study.items)) o.study = d.study;
  if (!o.allowance || typeof o.allowance !== 'object') o.allowance = {};
  o.members.forEach(function(m){
    if (!o.allowance[m.id] || typeof o.allowance[m.id] !== 'object') o.allowance[m.id] = {start:0, txs:[]};
    if (!Array.isArray(o.allowance[m.id].txs)) o.allowance[m.id].txs = [];
  });
  if (!o.stamps || typeof o.stamps !== 'object') o.stamps = {};
  if (!o.mission || typeof o.mission !== 'object') o.mission = d.mission;
  if (typeof o.mission.together !== 'number') o.mission.together = 0;
  if (typeof o.mission.idx !== 'number' || o.mission.idx < 0 || o.mission.idx >= MISSIONS.length) o.mission.idx = 0;
  if (!Array.isArray(o.chat)) o.chat = [];
  if (!o.chatMember || !o.members.some(function(m){ return m.id === o.chatMember; })) o.chatMember = o.members[0].id;
  o.chatLocked = !!o.chatLocked;
  if (!o.alarm || typeof o.alarm !== 'object') o.alarm = d.alarm;
  if (typeof o.alarm.enabled !== 'boolean') o.alarm.enabled = false;
  if (typeof o.alarm.time !== 'string' || !/^\d{2}:\d{2}$/.test(o.alarm.time)) o.alarm.time = '20:00';
  if (typeof o.timerSet !== 'number' || o.timerSet < 1) o.timerSet = 10;
  o.v = 1;
  return o;
}

function findMember(id){

function balanceOf(id){
  var a = allowanceOf(id);
  var b = num(a.start);
  a.txs.forEach(function(t){
    var amt = num(t.amount);
    b += (t.type === 'withdraw') ? -amt : amt;
  });
  return b;
}
function sumBy(id, type, dateKey){
  var total = 0;
  allowanceOf(id).txs.forEach(function(t){
    if (t.type !== type) return;
    if (dateKey && t.date !== dateKey) return;
    total += num(t.amount);
  });
  return total;
}

function hasBatchim(word){
  var w = String(word === null || word === undefined ? '' : word).trim();
  if (!w) return false;
  var code = w.charCodeAt(w.length - 1);
  if (code < 0xAC00 || code > 0xD7A3) return false;
  return ((code - 0xAC00) % 28) !== 0;
}
function josa(word, withB, withoutB){ return hasBatchim(word) ? withB : withoutB; }

var AC = null;
function chime(kind){
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!AC) AC = new Ctx();
    if (AC.state === 'suspended' && AC.resume) AC.resume();
    var now = AC.currentTime + 0.02;
    var notes = (kind === 'alarm')
      ? [[523.25, 0], [659.25, 0.24], [783.99, 0.48], [1046.5, 0.78]]
      : [[659.25, 0], [783.99, 0.17], [987.77, 0.34]];
    notes.forEach(function(pair){
      var o = AC.createOscillator();
      var g = AC.createGain();
      o.type = 'sine';
      o.frequency.value = pair[0];
      var t0 = now + pair[1];
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.16, t0 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0008, t0 + 0.95);
      o.connect(g);
      g.connect(AC.destination);
      o.start(t0);
      o.stop(t0 + 1.05);
    });
  } catch (e) {}
}

var T = {
  mode: 'down',
  running: false,
  remain: (S.timerSet || 10) * 60000,
  set: (S.timerSet || 10) * 60000,
  elapsed: 0,
  base: 0,
  endAt: 0,
  startedAt: 0
};

function fmtMS(ms){
  var total = Math.max(0, Math.ceil(ms / 1000));
  var h = Math.floor(total / 3600);
  var m = Math.floor((total % 3600) / 60);
  var s = total % 60;
  if (h > 0) return h + ':' + pad2(m) + ':' + pad2(s);
  return pad2(m) + ':' + pad2(s);
}
function timerDisplay(){
  if (T.mode === 'down') {
    return fmtMS(T.running ? Math.max(0, T.endAt - Date.now()) : T.remain);
  }
  var e = T.running ? T.base + (Date.now() - T.startedAt) : T.elapsed;
  return fmtMS(e);
}
function paintTimer(){
  var t = document.getElementById('timer-time');
  if (t) t.textContent = timerDisplay();
  var b = document.getElementById('timer-start');
  if (b) b.innerHTML = T.running ? '⏸ 일시정지' : '▶ 시작';
  var hint = document.getElementById('timer-hint');
  if (hint) {
    if (T.mode === 'down') {
      hint.textContent = T.running ? '집중하는 중이에요 🌱' : (Math.round(T.set / 60000) + '분 · 시작을 눌러요');
    } else {
      hint.textContent = T.running ? '재는 중이에요 ⏱️' : '0:00부터 재요';
    }
  }
}
function timerStartPause(){
  if (T.running) {
    if (T.mode === 'down') T.remain = Math.max(0, T.endAt - Date.now());
    else { T.elapsed = T.base + (Date.now() - T.startedAt); T.base = T.elapsed; }
    T.running = false;
    paintTimer();
    return;
  }
  if (T.mode === 'down' && T.remain <= 0) T.remain = T.set;
  if (T.mode === 'up') { T.startedAt = Date.now(); T.base = T.elapsed; }
  else { T.endAt = Date.now() + T.remain; }
  T.running = true;
  chime('soft');
  paintTimer();
}
function timerReset(){
  T.running = false;
  T.remain = T.set;
  T.elapsed = 0;
  T.base = 0;
  paintTimer();
}
function timerTick(){
  if (!T.running) return;
  if (T.mode === 'down') {
    var left = T.endAt - Date.now();
    if (left <= 0) {
      T.remain = 0;
      T.running = false;
      paintTimer();
      onTimerEnd();
      return;
    }
  }
  paintTimer();
}
function onTimerEnd(){
  chime('alarm');
  var tabletLine = S.alarm.enabled
    ? '<p class="sheet-desc center">약속한 태블릿 시간도 함께 확인해요 🌙</p>'
    : '';
  openModal(
    '<div class="sheet center">' +
      '<div class="big-emoji">⏰</div>' +
      '<div class="sheet-title">시간 다 됐어요!</div>' +
      '<p class="sheet-desc center">' + (T.mode === 'down' ? '약속한 시간을 잘 지켰어요. 참 잘했어요 🌟' : '오늘 재는 시간을 마쳤어요 ✨') + '</p>' +
      tabletLine +
      '<button class="btn primary wfull" data-modal-close>확인</button>' +
    '</div>',
    {center:true}
  );
}

    return '<button class="chip' + (m.id === mem.id ? ' on' : '') + '" data-act="sel-allow" data-id="' + m.id + '">' + esc(m.name) + '</button>';
  }).join('');

  var days = [];
  var n = new Date();
  for (var i = 0; i < 7; i++) {
    var d = addDays(n, -i);
    var k = dkey(d);
    var cnt = 0;
    a.txs.forEach(function(t){ if (t.type === 'study' && t.date === k) cnt++; });
    var sum = 0;
    a.txs.forEach(function(t){ if (t.type === 'study' && t.date === k) sum += num(t.amount); });
    days.push({
      key:k,
      label: shortDate(k) + (i === 0 ? ' (오늘)' : ''),
      cnt:cnt,
      sum:sum
    });
  }

  var dayRows = days.map(function(d){
    return '<div class="day-row"><span class="d">' + d.label + '</span>' +
      (d.cnt ? '<span class="n">공부 완료 ' + d.cnt + '개 · +' + comma(d.sum) + '원</span>'
             : '<span class="tiny muted">아직 없어요</span>') + '</div>';
  }).join('');

  var txs = a.txs.slice(0, 30).map(function(t){
    var label = t.type === 'study' ? '공부 적립' : (t.type === 'deposit' ? '입금' : '사용');
    var plus = t.type !== 'withdraw';
    return '<div class="tx">' +
      '<span class="tag ' + (plus ? '' : 'blue') + '">' + label + '</span>' +
      '<span class="tx-memo">' + esc(t.memo || label) + '<span class="tx-day"> · ' + shortDate(t.date || t.dateKey || dkey()) + '</span></span>' +
      '<span class="tx-amt ' + (plus ? 'plus' : 'minus') + '">' + (plus ? '+' : '-') + comma(t.amount) + '원</span>' +
      '<button class="mini danger" data-act="del-tx" data-id="' + t.id + '" aria-label="지우기">✕</button>' +
    '</div>';
  }).join('');

  return '<section class="card allow-top">' +
      '<div class="card-title">🐷 ' + esc(mem.name) + ' 용돈기입장</div>' +
      '<p class="sub-line">공부를 끝낼 때마다 정한 금액(100원·50원)씩 차곡차곡 쌓여요</p>' +
      '<div class="chat-chips">' + chips + '</div>' +
      '<div class="row between" style="margin-top:14px">' +
        '<span class="small muted" style="font-weight:900">지금 모은 돈</span>' +
        '<span class="allow-amount" id="allow-amount">' + comma(bal) + '<em>원</em></span>' +
      '</div>' +
      '<div class="allow-tags">' +
        '<span class="tag">시작 금액 <b id="tag-start">' + comma(a.start) + '원</b></span>' +
        '<span class="tag">공부 적립 <b id="tag-study">+' + comma(studySum) + '원</b></span>' +
        '<span class="tag">입금 <b id="tag-dep">+' + comma(dep) + '원</b></span>' +
        '<span class="tag">사용 <b id="tag-wd">-' + comma(wd) + '원</b></span>' +
      '</div>' +
      '<label class="field">시작 금액 (이미 모아 둔 돈)' +
        '<input class="inp big" id="allow-start" data-allow-start inputmode="numeric" value="' + num(a.start) + '">' +

/* 스티커: 'svg:스티치'처럼 저장된 것은 캐릭터 그림으로, 나머지는 이모지로 보여 줘요 */
function stickerHTML(t){
  var s = String(t === null || t === undefined ? '' : t);
  if (s.indexOf('svg:') === 0) {
    var key = s.slice(4);
    return av(AVATARS.indexOf(key) >= 0 ? key : 'stitch', 56);
  }
  return esc(s);
}

function askStudyForm(opts){
  var item = opts.item || null;
  var memberId = opts.memberId || sel.study;
  var mem = getMember(memberId);
  askForm({
    title: opts.title,
    desc: mem.name + ' 공부 항목이에요. 단위와 금액은 비워도 괜찮아요.',
    submit: '저장',
    fields: [
      {key:'label', label:'공부 이름', value: item ? item.label : '', placeholder:'예: 받아쓰기 연습'},
      {key:'unit', label:'단위 (선택)', value: item ? item.unit : '', placeholder:'예: 10문제, 30분'},
      {key:'amount', label:'체크하면 쌓이는 금액 (원)', value: item ? item.amount : 100, inputmode:'numeric'}
    ],
    onSubmit: function(v){
      var label = String(v.label || '').trim();
      if (!label) { toast('공부 이름을 적어 주세요'); return; }
      var amount = Math.max(0, num(v.amount));
      var unit = String(v.unit || '').trim();
      if (item) {
        item.label = label;
        item.unit = unit;
        item.amount = amount;
        if (item.pinnedId) {
          S.studyPinned.forEach(function(p){
            if (p.id === item.pinnedId) { p.label = label; p.unit = unit; p.amount = amount; }
          });
        }
        /* 이미 체크된 항목이면 적립 금액도 새 금액으로 */
        var a = allowanceOf(item.memberId);
        a.txs.forEach(function(t){
          if (t.type === 'study' && t.itemId === item.id) { t.amount = amount; t.memo = label; }
        });
        toast('공부 항목을 고쳤어요 ✏️');
      } else {
        S.study.items.push({
          id: uid(), pinnedId: null, memberId: memberId,
          label: label, unit: unit, amount: amount, done: false
        });
        toast('오늘의 공부에 추가했어요 📚');
      }
      save();
      render();
    }
  });
}

function openCalendar(){
  var view = new Date();
  view.setDate(1);

  function draw(){
    var y = view.getFullYear();
    var mo = view.getMonth();
    var first = new Date(y, mo, 1);
    var startDow = first.getDay();
    var days = new Date(y, mo + 1, 0).getDate();
    var todayStr = dkey();
    var cells = '';
    for (var i = 0; i < startDow; i++) cells += '<div class="cal-cell empty"></div>';
    for (var d = 1; d <= days; d++) {
      var k = y + '-' + pad2(mo + 1) + '-' + pad2(d);
      var on = !!S.stamps[k];
      var today = k === todayStr;
      cells += '<div class="cal-cell' + (on ? ' on' : '') + (today ? ' today' : '') + '">' +
        '<span class="cal-num">' + d + '</span>' +
        (on ? '<span class="cal-stamp">' + av(child().avatar, 22) + '</span>' : '') +
      '</div>';
    }
    var cnt = monthStampKeys(y, mo + 1).length;

    openModal(
      '<div class="sheet">' +
        '<div class="sheet-head"><h3>📅 ' + esc(child().name) + ' 도장판</h3><button class="icon-btn" data-modal-close aria-label="닫기">✕</button></div>' +
        '<div class="cal-head">' +
          '<button class="mini" id="cal-prev" aria-label="이전 달">‹</button>' +
          '<b>' + y + '년 ' + (mo + 1) + '월</b>' +
          '<button class="mini" id="cal-next" aria-label="다음 달">›</button>' +
        '</div>' +
        '<div class="cal-grid">' + ['일','월','화','수','목','금','토'].map(function(x){
          return '<div class="cal-dow-cell">' + x + '</div>';
        }).join('') + '</div>' +
        '<div class="cal-grid">' + cells + '</div>' +
        '<p class="small muted center" style="margin-top:10px">이번 달 도장 ' + cnt + '개 · 도장은 하루에 1개씩 찍혀요</p>' +
      '</div>'
    );

    document.getElementById('cal-prev').addEventListener('click', function(){
      view = new Date(y, mo - 1, 1);
      draw();
    });
    document.getElementById('cal-next').addEventListener('click', function(){
      view = new Date(y, mo + 1, 1);
      draw();
    });
  }
  draw();
}

   ========================================================= */
document.addEventListener('click', function(e){
  var closeBtn = e.target.closest('[data-modal-close]');
  if (closeBtn) { closeModal(); return; }

  var btn = e.target.closest('[data-act]');
  if (!btn) return;
  var act = btn.getAttribute('data-act');

  /* ---- 공통 ---- */
  if (act === 'tab') {
    tab = btn.getAttribute('data-tab');
    scrollChat = (tab === 'chat');
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
    render();
    return;
  }
  if (act === 'open-settings') { openSettings(); return; }
  if (act === 'lock') { lockNow(); return; }
  if (act === 'trip') {
    var t = new Date(); t.setHours(0,0,0,0);
    var diff = Math.round((TRIP_START - t) / 86400000);
    toast(diff > 0
      ? '🎄 상해 크리스마스 여행 D-' + diff + ' · 설레는 크리스마스 여행 준비 중 ✨'
      : '🎄 상해 크리스마스 여행 · 설레는 크리스마스 여행 준비 중 ✨');
    return;
  }

  /* ---- 홈 ---- */
  if (act === 'stamp-cal') { openCalendar(); return; }
  if (act === 'mission-done') {
    if (S.mission.done) { toast('오늘 미션은 이미 완료했어요 ✓'); return; }
    S.mission.done = true;
    S.mission.together += 1;
    save();
    confetti(34);
    chime('soft');
    toast('우리 가족 최고! 오늘 미션 완료 🌟 (함께 ' + S.mission.together + '번)');
    render();
    return;
  }
  if (act === 'mission-new') {
    var pool = [];
    for (var mi = 0; mi < MISSIONS.length; mi++) { if (mi !== S.mission.idx) pool.push(mi); }
    S.mission.idx = pool[Math.floor(Math.random() * pool.length)];
    save();
    render();
    return;
  }

  /* ---- 할 일 ---- */
  if (act === 'add-todo') {
    var memberId = btn.getAttribute('data-member') || (S.members[0] && S.members[0].id);
    var mem = getMember(memberId);
    askForm({
      title: mem.name + ' 할 일 추가',
      desc: mem.name + '에게 필요한 할 일을 적어 주세요.',
      submit: '추가',
      fields: [{key:'label', label:'할 일', placeholder:'예: 책 30분 읽기'}],
      onSubmit: function(v){
        var label = String(v.label || '').trim();
        if (!label) { toast('할 일을 적어 주세요'); return; }
        S.todos.push({id:uid(), memberId:mem.id, label:label, done:false});
        save();
        toast(mem.name + ' 할 일을 추가했어요 ✅');
        render();
      }
    });
    return;
  }
  if (act === 'edit-todo') {
    var tid = btn.getAttribute('data-id');
    var todo = null;
    S.todos.forEach(function(x){ if (x.id === tid) todo = x; });
    if (!todo) return;
    askForm({
      title:'할 일 고치기', submit:'저장',
      fields: [{key:'label', label:'할 일', value:todo.label}],
      onSubmit: function(v){
        var label = String(v.label || '').trim();
        if (!label) return;
        todo.label = label;
        save();
        render();
      }
    });
    return;
  }
  if (act === 'del-todo') {
    var did = btn.getAttribute('data-id');
    S.todos = S.todos.filter(function(x){ return x.id !== did; });
    save();
    toast('할 일을 지웠어요');
    render();
    return;
  }
  if (act === 'toggle-todo') {
    var id = btn.getAttribute('data-id');
    var item = null;
    S.todos.forEach(function(x){ if (x.id === id) item = x; });
    if (!item) return;
    item.done = !item.done;

    var owner = findMember(item.memberId);
    if (item.done && owner) {
      if (item.memberId === S.childId) {
        var wasStamped = !!S.stamps[dkey()];
        stampToday();
        if (!wasStamped) toast(childName() + ' 오늘 도장을 찍었어요 🌺');
      }
      var mine = S.todos.filter(function(x){ return x.memberId === item.memberId; });
      var allDone = mine.length > 0 && mine.every(function(x){ return x.done; });
      save();
      render();
      if (allDone) showHighFive(owner);
      return;
    }
    save();
    render();
    return;
  }

  /* ---- 공부 ---- */
  if (act === 'sel-study') {
    sel.study = btn.getAttribute('data-id');
    render();
    return;
  }
  if (act === 'toggle-study') {
    var sid = btn.getAttribute('data-id');
    var sit = null;
    S.study.items.forEach(function(x){ if (x.id === sid) sit = x; });
    if (!sit) return;
    var rowEl = btn.closest('[data-row]');
    var rect = rowEl ? rowEl.getBoundingClientRect() : null;
    sit.done = !sit.done;

    if (sit.done) {
      if (num(sit.amount) > 0) {
        addStudyTx(sit);
        coinPop(rect, sit.amount);
        chime('soft');
        toast('🪙 ' + comma(sit.amount) + '원! ' + getMember(sit.memberId).name + ' 돼지저금통에 쏙');
      } else {
        toast('오늘의 공부 하나 완료 ✓');
      }
      if (sit.memberId === S.childId) stampToday();
      save();
      render();
      return;
    }
    removeStudyTx(sit);
    save();
    toast('체크를 풀어서 적립도 함께 취소했어요');
    render();
    return;
  }
  if (act === 'add-study') { askStudyForm({title:'오늘의 공부 추가'}); return; }
  if (act === 'edit-study') {
    var eid = btn.getAttribute('data-id');
    var eitem = null;
    S.study.items.forEach(function(x){ if (x.id === eid) eitem = x; });
    if (!eitem) return;
    askStudyForm({title:'공부 고치기', item:eitem});
    return;
  }
  if (act === 'del-study') {
    var delId = btn.getAttribute('data-id');
    var ditem = null;
    S.study.items.forEach(function(x){ if (x.id === delId) ditem = x; });
    if (!ditem) return;
    askConfirm('공부 항목을 지울까요?', esc(ditem.label) + ' 항목을 오늘 목록에서 지워요.' +
      (ditem.pinnedId ? '<br>고정 항목에서도 함께 빠져서 내일부터 다시 올라오지 않아요.' : ''),
      '지우기', function(){
        S.study.items = S.study.items.filter(function(x){ return x.id !== delId; });
        if (ditem.pinnedId) {
          S.studyPinned = S.studyPinned.filter(function(p){ return p.id !== ditem.pinnedId; });
        }
        removeStudyTx(ditem);
        save();
        render();
      }, true);
    return;
  }
  if (act === 'pin-study') {
    var pid = btn.getAttribute('data-id');
    var pitem = null;
    S.study.items.forEach(function(x){ if (x.id === pid) pitem = x; });
    if (!pitem) return;
    if (pitem.pinnedId && S.studyPinned.some(function(p){ return p.id === pitem.pinnedId; })) {
      S.studyPinned = S.studyPinned.filter(function(p){ return p.id !== pitem.pinnedId; });
      pitem.pinnedId = null;
      save();
      toast('고정을 풀었어요. 내일부터 자동으로 올라오지 않아요');
    } else {
      var newPin = {id:uid(), memberId:pitem.memberId, label:pitem.label, unit:pitem.unit, amount:num(pitem.amount)};
      S.studyPinned.push(newPin);
      pitem.pinnedId = newPin.id;
      save();
      toast('고정 항목에 담았어요. 매일 아침 자동으로 올라와요 📌');
    }
    render();
    return;
  }
  if (act === 'open-pinned') { openPinned(); return; }
  if (act === 'add-pinned') {
    var pm = getMember(btn.getAttribute('data-member') || sel.study);
    askStudyForm({title: pm.name + ' 고정 항목 추가', memberId: pm.id});
    return;
  }
  if (act === 'edit-pinned') {
    var peid = btn.getAttribute('data-id');
    var pin = null;
    S.studyPinned.forEach(function(p){ if (p.id === peid) pin = p; });
    if (!pin) return;
    askForm({
      title:'고정 항목 고치기', submit:'저장',
      desc:'바꾼 내용은 오늘 목록에도 함께 반영돼요.',
      fields:[
        {key:'label', label:'공부 이름', value:pin.label},
        {key:'unit', label:'단위 (선택)', value:pin.unit},
        {key:'amount', label:'금액 (원)', value:pin.amount, inputmode:'numeric'}
      ],
      onSubmit: function(v){
        var label = String(v.label || '').trim();
        if (!label) return;
        pin.label = label;
        pin.unit = String(v.unit || '').trim();
        pin.amount = Math.max(0, num(v.amount));
        S.study.items.forEach(function(x){
          if (x.pinnedId === pin.id) {
            x.label = pin.label;
            x.unit = pin.unit;
            x.amount = pin.amount;
            if (x.done) {
              allowanceOf(x.memberId).txs.forEach(function(t){
                if (t.type === 'study' && t.itemId === x.id) { t.amount = pin.amount; t.memo = pin.label; }
              });
            }
          }
        });
        save();
        openPinned();
        toast('고정 항목을 고쳤어요 ✏️');
      }
    });

  }
  if (act === 'del-pinned') {
    var dpId = btn.getAttribute('data-id');
    askConfirm('고정 항목을 지울까요?', '내일부터 오늘의 공부 목록에 자동으로 올라오지 않아요.', '지우기', function(){
      S.studyPinned = S.studyPinned.filter(function(p){ return p.id !== dpId; });
      S.study.items.forEach(function(x){ if (x.pinnedId === dpId) x.pinnedId = null; });
      save();
      openPinned();
    }, true);
    return;
  }

  /* ---- 타이머 ---- */
  if (act === 'timer-mode') {
    var mode = btn.getAttribute('data-mode');
    if (mode !== T.mode) {
      T.running = false;
      T.mode = mode;
      if (mode === 'up') { T.elapsed = 0; T.base = 0; }
      else { T.remain = T.set; }
    }
    render();
    return;
  }
  if (act === 'timer-start') { timerStartPause(); return; }
  if (act === 'timer-reset') { timerReset(); return; }
  if (act === 'preset') {
    var min = num(btn.getAttribute('data-min'));
    T.mode = 'down';
    T.running = false;
    T.set = min * 60000;
    T.remain = T.set;
    S.timerSet = min;
    save();
    render();
    return;
  }
  if (act === 'set-custom') {
    var inp = document.getElementById('custom-min');
    var m2 = num(inp ? inp.value : 0);
    if (!m2 || m2 < 1) { toast('분을 적어 주세요'); return; }
    if (m2 > 180) m2 = 180;
    T.mode = 'down';
    T.running = false;
    T.set = m2 * 60000;
    T.remain = T.set;
    S.timerSet = m2;
    save();
    render();
    toast(m2 + '분으로 맞췄어요 ⏳');
    return;
  }
  if (act === 'alarm-toggle') {
    S.alarm.enabled = !S.alarm.enabled;
    S.alarm.lastFired = null;
    save();
    render();
    if (S.alarm.enabled) {
      chime('soft');
      toast(S.alarm.time + '에 태블릿 알람을 울려드릴게요 🌙');
    }
    return;
  }

  /* ---- 용돈 ---- */
  if (act === 'sel-allow') {
    sel.allow = btn.getAttribute('data-id');
    render();
    return;
  }
  if (act === 'allow-in' || act === 'allow-out') {
    var isIn = act === 'allow-in';
    var am = getMember(sel.allow);
    askForm({
      title: isIn ? am.name + ' 입금' : am.name + ' 사용',
      desc: isIn ? '들어온 돈을 적어 주세요.' : '쓴 돈을 적어 주세요.',
      submit: isIn ? '입금' : '사용',
      fields: [
        {key:'amount', label:'금액 (원)', value:'', inputmode:'numeric', placeholder:'예: 1000'},
        {key:'memo', label:'메모 (선택)', value:'', placeholder: isIn ? '예: 할머니 용돈' : '예: 문구점'}
      ],
      onSubmit: function(v){
        var amount = Math.max(0, num(v.amount));
        if (!amount) { toast('금액을 적어 주세요'); return; }
        allowanceOf(am.id).txs.unshift({
          id: uid(),
          type: isIn ? 'deposit' : 'withdraw',
          amount: amount,
          memo: String(v.memo || '').trim() || (isIn ? '입금' : '사용'),
          date: dkey(),
          ts: Date.now()
        });
        save();
        toast((isIn ? '입금 ' : '사용 ') + comma(amount) + '원을 적었어요');
        render();
      }
    });
    return;
  }
  if (act === 'del-tx') {
    var txId = btn.getAttribute('data-id');
    var a = allowanceOf(sel.allow);
    a.txs = a.txs.filter(function(t){ return t.id !== txId; });
    save();
    render();
    return;
  }

  /* ---- 채팅 ---- */
  if (act === 'sel-chat') {
    if (S.chatLocked) { toast('잠금을 풀면 다른 사람으로 바꿀 수 있어요'); return; }
    sel.chat = btn.getAttribute('data-id');
    S.chatMember = sel.chat;
    save();
    render();
    return;
  }
  if (act === 'chat-lock') {
    S.chatLocked = true;
    save();
    render();
    var lockName = getMember(sel.chat).name;
    toast('이 기기에서는 ' + lockName + josa(lockName, '으로', '로') + ' 기억할게요 🔒');
    return;
  }
  if (act === 'chat-unlock') {
    S.chatLocked = false;
    save();
    render();
    return;
  }
  if (act === 'heart') {
    var cid = btn.getAttribute('data-id');
    S.chat.forEach(function(c){
      if (c.id === cid) {
        c.hearted = !c.hearted;
        c.hearts = Math.max(0, (c.hearts || 0) + (c.hearted ? 1 : -1));
      }

    save();
    render();
    return;
  }
  if (act === 'del-chat') {
    var dcId = btn.getAttribute('data-id');
    S.chat = S.chat.filter(function(c){ return c.id !== dcId; });
    save();
    render();
    return;
  }
  if (act === 'sticker-toggle') {
    stickerOpen = !stickerOpen;
    render();
    return;
  }
  if (act === 'pick-sticker') {
    var pickedSticker = btn.getAttribute('data-emoji');

    return;

  if (act === 'pick-avatar') {
    var amId = btn.getAttribute('data-id');

      mm.avatar = ava;

      openSettings();
      render();

    var used = S.members.map(function(m){ return m.avatar; });
    var pick = AVATARS.filter(function(a){ return used.indexOf(a) < 0; })[0] || AVATARS[S.members.length % AVATARS.length];
    S.members.push({id:uid(), name:'가족', intro:'함께 기록 중', avatar:pick});
    allowanceOf(S.members[S.members.length - 1].id);
    save();
    openSettings();
    render();
    return;
  }
  if (act === 'del-member') {
    var dId = btn.getAttribute('data-id');
    var target = findMember(dId);
    if (!target || S.members.length <= 1) return;
    askConfirm('구성원을 뺄까요?', esc(target.name) + '의 할 일과 오늘의 공부 목록도 함께 정리돼요. 쪽지는 그대로 남아 있어요.', '빼기', function(){
      S.members = S.members.filter(function(m){ return m.id !== dId; });
      S.todos = S.todos.filter(function(t){ return t.memberId !== dId; });
      S.study.items = S.study.items.filter(function(i){ return i.memberId !== dId; });
      S.studyPinned = S.studyPinned.filter(function(p){ return p.memberId !== dId; });
      if (S.childId === dId) S.childId = S.members[0].id;
      if (sel.study === dId) sel.study = S.childId;
      if (sel.allow === dId) sel.allow = S.childId;
      if (sel.chat === dId) sel.chat = S.members[0].id;
      if (S.chatMember === dId) S.chatMember = S.members[0].id;
      save();
      openSettings();
      render();
    }, true);
    return;
  }
  if (act === 'reset-all') {
    askConfirm('모든 기록을 지울까요?', '할 일 · 공부 · 도장 · 용돈 · 쪽지가 모두 지워지고 처음 상태로 돌아가요. 되돌릴 수 없어요.', '처음으로', function(){
      try { localStorage.removeItem(KEY); } catch (e) {}
      S = initialState();
      sel = {study:S.childId, allow:S.childId, chat:S.childId};
      save();
      tab = 'home';
      closeModal();
      render();
      toast('처음 상태로 돌아왔어요 🌱');
    }, true);
    return;
  }
});

document.addEventListener('input', function(e){
  var el = e.target;
  if (!el || !el.getAttribute) return;

  if (el.hasAttribute('data-field')) {
    var id = el.getAttribute('data-id');
    var f = el.getAttribute('data-field');
    var m = findMember(id);
    if (!m) return;
    if (f === 'member-name') {
      if (el.value.trim()) m.name = el.value.trim();
    } else if (f === 'member-intro') {
      m.intro = el.value;
    } else if (f === 'member-start') {
      allowanceOf(id).start = num(el.value);
    }
    save();
    return;
  }

  if (el.hasAttribute('data-allow-start')) {
    allowanceOf(sel.allow).start = num(el.value);
    save();
    patchAllow();
    return;
  }
});

document.addEventListener('change', function(e){
  var el = e.target;
  if (!el || !el.getAttribute) return;
  if (el.hasAttribute('data-alarm-time')) {
    var v = el.value || '20:00';
    S.alarm.time = v;
    S.alarm.lastFired = null;
    save();
    render();
    toast(v + '에 알람을 맞췄어요 🌙');
  }
});

document.addEventListener('click', function(e){
  var btn = e.target.closest('[data-act="chat-send"], #chat-send');

    var inp = document.getElementById('chat-input');
    if (inp) sendChatMessage(inp.value, 'text');
  }
});

/* =========================================================
   11.5 잠금 화면 (PIN 0103)
   ========================================================= */
var LOCK_PIN = '0103';
var LOCK_KEY_SESSION = 'family-dashboard-unlocked-v1';
var lockBuf = '';

function lockIsOpen(){
  try { return sessionStorage.getItem(LOCK_KEY_SESSION) === '1'; } catch(e){ return false; }
}
function lockRemember(){ try { sessionStorage.setItem(LOCK_KEY_SESSION, '1'); } catch(e){} }
function lockForget(){ try { sessionStorage.removeItem(LOCK_KEY_SESSION); } catch(e){} }

function paintLockDots(){
  var wrap = document.getElementById('lock-dots');
  if (!wrap) return;
  for (var i = 0; i < wrap.children.length; i++){
    wrap.children[i].className = i < lockBuf.length ? 'lock-dot on' : 'lock-dot';
  }
}

function shakeLock(msg){
  var err = document.getElementById('lock-err');
  if (err) err.textContent = msg || '';
  var card = document.querySelector('.lock-card');
  if (card){
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
  }
}

function showLock(){
  var el = document.getElementById('lock');
  if (!el) return;
  document.body.classList.add('locked');
  lockBuf = '';
  paintLockDots();
  var err = document.getElementById('lock-err');
  if (err) err.textContent = '';
  el.classList.remove('hidden');
  el.setAttribute('aria-hidden', 'false');
}

function hideLock(){
  var el = document.getElementById('lock');
  if (!el) return;
  el.classList.add('hidden');
  el.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('locked');
}

function unlockApp(){
  lockRemember();
  lockBuf = '';
  hideLock();
  try { render(); paintTimer(); } catch(e){}
}

function lockNow(){
  try { closeModal(); } catch(e){}
  lockForget();
  showLock();
  try { window.scrollTo(0, 0); } catch(e){}
}

function pressPin(k){
  if (k === 'del'){
    lockBuf = lockBuf.slice(0, -1);
    var e1 = document.getElementById('lock-err'); if (e1) e1.textContent = '';
    paintLockDots();
    return;
  }
  if (lockBuf.length >= 4) return;
  lockBuf += k;
  paintLockDots();
  if (lockBuf.length === 4){
    if (lockBuf === LOCK_PIN){
      setTimeout(unlockApp, 110);
    } else {
      setTimeout(function(){
        shakeLock('비밀번호가 맞지 않아요 🌺');
        lockBuf = '';
        paintLockDots();
      }, 130);
    }
  }
}

function initLock(){
  var face = document.getElementById('lock-face');
  if (face){
    try { face.innerHTML = av('stitch', 82); } catch(e){}
  }
  var pad = document.getElementById('lock-pad');
  if (pad){
    pad.addEventListener('click', function(e){
      var b = e.target.closest ? e.target.closest('[data-pin]') : null;
      if (!b) return;
      pressPin(b.getAttribute('data-pin'));
    });
  }
  document.addEventListener('keydown', function(e){
    if (!document.body.classList.contains('locked')) return;
    if (/^[0-9]$/.test(e.key)) { pressPin(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); pressPin('del'); }
  });
  if (lockIsOpen()) { hideLock(); } else { showLock(); }
  paintLockDots();
}

/* =========================================================
   12. 시작
   ========================================================= */
ensureToday();
render();
paintTimer();
initLock();

/* 홈을 다시 열어도 오늘 정보로 갱신 */
window.addEventListener('focus', function(){
  ensureToday();
  renderHeader();
});

})();
</script>
